[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
utils  = { path = "../utils" }
nodus = { path = "../nodus" }
prism = { path = "../prism"  }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
renet   = "2.0.0"
renet_netcode = "2.0.0"
bincode = "2"
rand = "0.10.1"
bytes = "1.12.1"
winit = "0.30"
pollster = "0.3"
wgpu = "30"
bytemuck = "1"
glyphon = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
weave = { git = "https://github.com/Snowdeenn/weave.git" }
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"

